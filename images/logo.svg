<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00"/>
      <stop offset="100%" style="stop-color:#E06800"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#fff" stroke-width="6" opacity="0.2"/>
  <!-- Play triangle -->
  <polygon points="210,150 210,362 370,256" fill="#fff"/>
  <!-- Small MPV text -->
  <text x="256" y="440" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="48" font-weight="700" fill="#fff" opacity="0.9">mpv</text>
</svg>
