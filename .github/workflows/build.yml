name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Prevent concurrent release builds from clobbering each other
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.1'  # Must match macapp/build.sh NODE_VERSION

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

  sync-version:
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout main branch
        run: git checkout main

      - name: Sync version to Info.plist
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          sed -i "s|<string>[0-9]*\.[0-9]*\.[0-9]*</string>|<string>${VERSION}</string>|g" macapp/Info.plist
          echo "Synced Info.plist to version $VERSION"

      - name: Update SECURITY.md supported versions
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          MAJOR_MINOR="${VERSION%.*}"

          # Add new version as supported, mark previous "Yes" as "No"
          awk -v ver="${MAJOR_MINOR}.x" '
          /\| Version \| Supported \|/ {
              print; getline; print
              print "| " ver "   | Yes       |"
              next
          }
          /\| Yes/ && !done {
              gsub(/\| Yes/, "| No")
              done = 1
          }
          { print }
          ' SECURITY.md > SECURITY.md.tmp && mv SECURITY.md.tmp SECURITY.md

          echo "Updated SECURITY.md with v${MAJOR_MINOR}.x as supported"

      - name: Generate CHANGELOG.md from PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"

          # Find previous release tag
          PREV_TAG=$(gh release list -R MrGameVlogger/Jellyfin_mpv_play --limit 2 --json tagName -q '.[1].tagName' 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release found, generating from all PRs"
            RANGE=""
          else
            echo "Previous release: $PREV_TAG"
            RANGE="$PREV_TAG..HEAD"
          fi

          # Get merged PRs since last release
          PRS=$(gh pr list -R MrGameVlogger/Jellyfin_mpv_play --state merged --limit 100 --json number,title,mergedAt --jq "
            .[] | select(.mergedAt != null) | \"\(.number)|\(.title)\"
          " 2>/dev/null || echo "")

          # Categorize PRs
          FEAT=""
          FIX=""
          DOCS=""
          CI=""
          OTHER=""

          while IFS='|' read -r num title; do
            [ -z "$num" ] && continue
            entry="- ${title} ([#${num}](https://github.com/MrGameVlogger/Jellyfin_mpv_play/pull/${num}))"
            case "$title" in
              feat:*|Feat:*) FEAT="${FEAT}${entry}\n" ;;
              fix:*|Fix:*) FIX="${FIX}${entry}\n" ;;
              docs:*|Docs:*) DOCS="${DOCS}${entry}\n" ;;
              ci:*|Ci:*) CI="${CI}${entry}\n" ;;
              release:*|Release:*) ;; # Skip release commits
              *) OTHER="${OTHER}${entry}\n" ;;
            esac
          done <<< "$PRS"

          # Build changelog section
          NEW_ENTRY="## v${VERSION} — Release\n\n"
          [ -n "$FEAT" ] && NEW_ENTRY="${NEW_ENTRY}### Features\n${FEAT}\n"
          [ -n "$FIX" ] && NEW_ENTRY="${NEW_ENTRY}### Bug Fixes\n${FIX}\n"
          [ -n "$DOCS" ] && NEW_ENTRY="${NEW_ENTRY}### Documentation\n${DOCS}\n"
          [ -n "$CI" ] && NEW_ENTRY="${NEW_ENTRY}### CI/Infrastructure\n${CI}\n"
          [ -n "$OTHER" ] && NEW_ENTRY="${NEW_ENTRY}### Other Changes\n${OTHER}\n"

          # Prepend to existing CHANGELOG.md (keep old entries)
          if [ -f CHANGELOG.md ]; then
            # Remove the header and insert new entry
            awk '/^## v/{found=1} found{print}' CHANGELOG.md > /tmp/old_entries.md
            {
              echo "# Changelog"
              echo ""
              echo "All notable changes to Jellyfin MPV Play are documented here."
              echo ""
              echo -e "$NEW_ENTRY"
              echo "---"
              echo ""
              cat /tmp/old_entries.md
            } > CHANGELOG.md
          else
            {
              echo "# Changelog"
              echo ""
              echo "All notable changes to Jellyfin MPV Play are documented here."
              echo ""
              echo -e "$NEW_ENTRY"
            } > CHANGELOG.md
          fi

          echo "Generated CHANGELOG.md entry for v${VERSION}"

      - name: Commit synced files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git add macapp/Info.plist SECURITY.md CHANGELOG.md
          git diff --cached --quiet || git commit -m "ci: auto-sync version, changelog, security for v${{ needs.get-version.outputs.version }}"
          git push origin main

  build-linux:
    needs: [get-version, sync-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Node.js
        uses: actions/cache@v6
        with:
          path: .node-cache
          key: node-linux-x64-${{ env.NODE_VERSION }}

      - name: Download Node.js
        run: |
          mkdir -p .node-cache
          TARBALL=".node-cache/node-v${NODE_VERSION}-linux-x64.tar.gz"
          if [ ! -f "$TARBALL" ]; then
            curl -L "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz" -o "$TARBALL"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Assemble bundle
        run: |
          NAME="JellyfinMPVPlay-Linux-v${{ needs.get-version.outputs.version }}"
          mkdir -p "$NAME/node" "$NAME/images"

          # Extract Node.js
          tar -xzf ".node-cache/node-v${NODE_VERSION}-linux-x64.tar.gz" -C .node-cache
          cp -R .node-cache/node-v${NODE_VERSION}-linux-x64/bin "$NAME/node/"
          cp -R .node-cache/node-v${NODE_VERSION}-linux-x64/lib "$NAME/node/"
          rm -rf "$NAME/node/lib/node_modules/npm" \
                 "$NAME/node/lib/node_modules/corepack" \
                 "$NAME/node/bin/npm" \
                 "$NAME/node/bin/npx" \
                 "$NAME/node/bin/corepack" 2>/dev/null || true

          # Copy app files
          cp shim.js "$NAME/"
          cp package.json "$NAME/"
          cp config.example.js "$NAME/"
          cp -R node_modules "$NAME/"
          cp -R linux/* "$NAME/"
          cp images/icon.svg "$NAME/images/"

          chmod +x "$NAME/launch.sh"

          # Create archive
          tar -czf "${NAME}.tar.gz" "$NAME"
          echo "BUNDLE=${NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-bundle
          path: ${{ env.BUNDLE }}

  build-windows:
    needs: [get-version, sync-version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Node.js
        uses: actions/cache@v6
        with:
          path: .node-cache
          key: node-win-x64-${{ env.NODE_VERSION }}

      - name: Download Node.js
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .node-cache | Out-Null
          $zip = ".node-cache/node-v${{ env.NODE_VERSION }}-win-x64.zip"
          if (-not (Test-Path $zip)) {
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v${{ env.NODE_VERSION }}/node-v${{ env.NODE_VERSION }}-win-x64.zip" -OutFile $zip
          }
          Write-Output "NODE_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Assemble bundle
        shell: pwsh
        run: |
          $ver = "${{ needs.get-version.outputs.version }}"
          $name = "JellyfinMPVPlay-Windows-v$ver"

          New-Item -ItemType Directory -Force -Path "$name/node" | Out-Null

          # Extract Node.js
          Expand-Archive -Path "${{ env.NODE_ZIP }}" -DestinationPath .node-cache -Force
          $nodeDir = ".node-cache/node-v${{ env.NODE_VERSION }}-win-x64"
          Copy-Item "$nodeDir/node.exe" "$name/node/"
          Copy-Item "$nodeDir/*.dll" "$name/node/"

          # Copy app files
          Copy-Item shim.js "$name/"
          Copy-Item package.json "$name/"
          Copy-Item config.example.js "$name/"
          Copy-Item -Recurse node_modules "$name/"
          Copy-Item -Recurse windows/* "$name/"

          # Create archive
          Compress-Archive -Path "$name" -DestinationPath "$name.zip"
          Write-Output "BUNDLE=$name.zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: ${{ env.BUNDLE }}

  build-macos:
    needs: [get-version, sync-version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app
        run: |
          cd macapp
          ./build.sh

      - name: Create archive
        run: |
          NAME="JellyfinMPVPlay-macOS-v${{ needs.get-version.outputs.version }}"
          ditto -c -k --sequesterRsrc --keepParent "Jellyfin MPV Play.app" "${NAME}.zip"
          echo "BUNDLE=${NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-bundle
          path: ${{ env.BUNDLE }}

  release:
    needs: [get-version, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-files/ \;
          echo "Release files:"
          ls -lh release-files/

          # Extract version-specific section from CHANGELOG.md
          VER_ESCAPED="${VERSION//./\\.}"
          awk "/^## v${VER_ESCAPED}/{found=1; next} found && /^## v/{exit} found" CHANGELOG.md > notes.md

          # Validate changelog section was found
          if [ ! -s notes.md ]; then
            echo "WARNING: No changelog section found for v${VERSION} in CHANGELOG.md"
            echo "## Jellyfin MPV Play v${VERSION}" > notes.md
          fi

          # Append quick start footer
          cat >> notes.md << 'EOF'

          ### Quick Start
          **macOS:** Unzip, move to Applications, launch. The setup wizard will guide you.

          **Linux:** Extract, edit `config.js`, run `./launch.sh`. See the included `.desktop` file for app launcher integration.

          **Windows:** Extract, edit `config.js`, run `launch.bat`.

          All bundles include their own Node.js runtime. Only [MPV Player](https://mpv.io/installation/) is required.

          For full documentation, see the [README](https://github.com/MrGameVlogger/Jellyfin_mpv_play#readme).
          EOF

          # Delete existing release if re-running (keep the tag)
          gh release delete "v${VERSION}" -R MrGameVlogger/Jellyfin_mpv_play --yes 2>/dev/null || true

          gh release create "v${VERSION}" \
            -R MrGameVlogger/Jellyfin_mpv_play \
            --title "v${VERSION}" \
            --notes-file notes.md \
            --verify-tag \
            release-files/*
