name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.1'  # Must match macapp/build.sh NODE_VERSION

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

  generate-notes:
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate release notes from PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"

          # Get the date of the most recent release (to filter PRs)
          LAST_RELEASE_DATE=$(gh release list -R MrGameVlogger/Jellyfin_mpv_play --limit 1 --json publishedAt -q '.[0].publishedAt' 2>/dev/null || echo "")
          echo "Last release date: $LAST_RELEASE_DATE"

          # Get merged PRs since last release
          if [ -n "$LAST_RELEASE_DATE" ]; then
            PRS=$(gh pr list -R MrGameVlogger/Jellyfin_mpv_play --state merged --limit 100 --json number,title,mergedAt --jq "
              .[] | select(.mergedAt != null and .mergedAt > \"$LAST_RELEASE_DATE\") | \"\(.number)|\(.title)\"
            " 2>/dev/null || echo "")
          else
            PRS=$(gh pr list -R MrGameVlogger/Jellyfin_mpv_play --state merged --limit 100 --json number,title,mergedAt --jq "
              .[] | select(.mergedAt != null) | \"\(.number)|\(.title)\"
            " 2>/dev/null || echo "")
          fi

          echo "Found PRs: $PRS"

          FEAT=""; FIX=""; DOCS=""; CI_CHG=""; OTHER=""
          while IFS='|' read -r num title; do
            [ -z "$num" ] && continue
            entry="- ${title} ([#${num}](https://github.com/MrGameVlogger/Jellyfin_mpv_play/pull/${num}))"
            case "$title" in
              feat:*|Feat:*) FEAT="${FEAT}${entry}\n" ;;
              fix:*|Fix:*) FIX="${FIX}${entry}\n" ;;
              docs:*|Docs:*) DOCS="${DOCS}${entry}\n" ;;
              ci:*|Ci:*) CI_CHG="${CI_CHG}${entry}\n" ;;
              release:*|Release:*) ;;
              *) OTHER="${OTHER}${entry}\n" ;;
            esac
          done <<< "$PRS"

          ENTRY="## v${VERSION}\n\n"
          [ -n "$FEAT" ] && ENTRY="${ENTRY}### Features\n${FEAT}\n"
          [ -n "$FIX" ] && ENTRY="${ENTRY}### Bug Fixes\n${FIX}\n"
          [ -n "$DOCS" ] && ENTRY="${ENTRY}### Documentation\n${DOCS}\n"
          [ -n "$CI_CHG" ] && ENTRY="${ENTRY}### CI/Infrastructure\n${CI_CHG}\n"
          [ -n "$OTHER" ] && ENTRY="${ENTRY}### Other Changes\n${OTHER}\n"

          mkdir -p sync-output
          echo -e "$ENTRY" > sync-output/changelog-entry.md

          # Sync Info.plist version
          sed "s|<string>[0-9]*\.[0-9]*\.[0-9]*</string>|<string>${VERSION}</string>|g" macapp/Info.plist > sync-output/Info.plist

          # Update SECURITY.md
          MAJOR_MINOR="${VERSION%.*}"
          awk -v ver="${MAJOR_MINOR}.x" '
          /\| Version \| Supported \|/ {
              print; getline; print
              print "| " ver "   | Yes       |"
              next
          }
          /\| Yes/ && !done {
              gsub(/\| Yes/, "| No")
              done = 1
          }
          { print }
          ' SECURITY.md > sync-output/SECURITY.md

          echo "Generated release notes and synced files for v${VERSION}"

      - name: Upload sync artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sync-files
          path: sync-output/

  build-linux:
    needs: [get-version, generate-notes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Node.js
        uses: actions/cache@v6
        with:
          path: .node-cache
          key: node-linux-x64-${{ env.NODE_VERSION }}

      - name: Download Node.js
        run: |
          mkdir -p .node-cache
          TARBALL=".node-cache/node-v${NODE_VERSION}-linux-x64.tar.gz"
          if [ ! -f "$TARBALL" ]; then
            curl -L "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz" -o "$TARBALL"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Assemble bundle
        run: |
          NAME="JellyfinMPVPlay-Linux-v${{ needs.get-version.outputs.version }}"
          mkdir -p "$NAME/node" "$NAME/images"

          tar -xzf ".node-cache/node-v${NODE_VERSION}-linux-x64.tar.gz" -C .node-cache
          cp -R .node-cache/node-v${NODE_VERSION}-linux-x64/bin "$NAME/node/"
          cp -R .node-cache/node-v${NODE_VERSION}-linux-x64/lib "$NAME/node/"
          rm -rf "$NAME/node/lib/node_modules/npm" \
                 "$NAME/node/lib/node_modules/corepack" \
                 "$NAME/node/bin/npm" \
                 "$NAME/node/bin/npx" \
                 "$NAME/node/bin/corepack" 2>/dev/null || true

          cp shim.js package.json config.example.js "$NAME/"
          cp -R node_modules "$NAME/"
          cp -R linux/* "$NAME/"
          cp images/icon.svg "$NAME/images/"
          chmod +x "$NAME/launch.sh"

          tar -czf "${NAME}.tar.gz" "$NAME"
          echo "BUNDLE=${NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-bundle
          path: ${{ env.BUNDLE }}

  build-windows:
    needs: [get-version, generate-notes]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Node.js
        uses: actions/cache@v6
        with:
          path: .node-cache
          key: node-win-x64-${{ env.NODE_VERSION }}

      - name: Download Node.js
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .node-cache | Out-Null
          $zip = ".node-cache/node-v${{ env.NODE_VERSION }}-win-x64.zip"
          if (-not (Test-Path $zip)) {
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v${{ env.NODE_VERSION }}/node-v${{ env.NODE_VERSION }}-win-x64.zip" -OutFile $zip
          }
          Write-Output "NODE_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Assemble bundle
        shell: pwsh
        run: |
          $ver = "${{ needs.get-version.outputs.version }}"
          $name = "JellyfinMPVPlay-Windows-v$ver"
          New-Item -ItemType Directory -Force -Path "$name/node" | Out-Null

          Expand-Archive -Path "${{ env.NODE_ZIP }}" -DestinationPath .node-cache -Force
          $nodeDir = ".node-cache/node-v${{ env.NODE_VERSION }}-win-x64"
          Copy-Item "$nodeDir/node.exe" "$name/node/"
          Copy-Item "$nodeDir/*.dll" "$name/node/"

          Copy-Item shim.js, package.json, config.example.js "$name/"
          Copy-Item -Recurse node_modules "$name/"
          Copy-Item -Recurse windows/* "$name/"

          Compress-Archive -Path "$name" -DestinationPath "$name.zip"
          Write-Output "BUNDLE=$name.zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: ${{ env.BUNDLE }}

  build-macos:
    needs: [get-version, generate-notes]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app
        run: |
          cd macapp
          ./build.sh

      - name: Create archive
        run: |
          NAME="JellyfinMPVPlay-macOS-v${{ needs.get-version.outputs.version }}"
          ditto -c -k --sequesterRsrc --keepParent "Jellyfin MPV Play.app" "${NAME}.zip"
          echo "BUNDLE=${NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-bundle
          path: ${{ env.BUNDLE }}

  release:
    needs: [get-version, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-files/ \;
          echo "Release files:"
          ls -lh release-files/

          # Use auto-generated changelog if available, fall back to CHANGELOG.md
          if [ -f artifacts/sync-files/changelog-entry.md ]; then
            cat artifacts/sync-files/changelog-entry.md > notes.md
          else
            VER_ESCAPED="${VERSION//./\\.}"
            awk "/^## v${VER_ESCAPED}/{found=1; next} found && /^## v/{exit} found" CHANGELOG.md > notes.md
          fi

          if [ ! -s notes.md ]; then
            echo "## Jellyfin MPV Play v${VERSION}" > notes.md
          fi

          cat >> notes.md << 'EOF'

          ### Quick Start
          **macOS:** Unzip, move to Applications, launch. The setup wizard will guide you.

          **Linux:** Extract, edit `config.js`, run `./launch.sh`. See the included `.desktop` file for app launcher integration.

          **Windows:** Extract, edit `config.js`, run `launch.bat`.

          All bundles include their own Node.js runtime. Only [MPV Player](https://mpv.io/installation/) is required.

          For full documentation, see the [README](https://github.com/MrGameVlogger/Jellyfin_mpv_play#readme).
          EOF

          gh release delete "v${VERSION}" -R MrGameVlogger/Jellyfin_mpv_play --yes 2>/dev/null || true

          gh release create "v${VERSION}" \
            -R MrGameVlogger/Jellyfin_mpv_play \
            --title "v${VERSION}" \
            --notes-file notes.md \
            --verify-tag \
            release-files/*
