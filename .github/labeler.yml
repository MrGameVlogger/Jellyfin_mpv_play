# Configuration for GitHub Labeler Action
# https://github.com/actions/labeler

macos:
  - changed-files:
    - any-glob-to-any-file:
      - 'macapp/**'
      - '**/*.swift'

shim:
  - changed-files:
    - any-glob-to-any-file:
      - 'shim.js'
      - 'config.example.js'

documentation:
  - changed-files:
    - any-glob-to-any-file:
      - '*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/copilot-instructions.md'
      - '.github/skills/**'

ci:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - '.github/codeql/**'

dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - 'package.json'
      - 'package-lock.json'

linux:
  - changed-files:
    - any-glob-to-any-file:
      - 'linux/**'

windows:
  - changed-files:
    - any-glob-to-any-file:
      - 'windows/**'

images:
  - changed-files:
    - any-glob-to-any-file:
      - 'images/**'
      - '**/*.png'
      - '**/*.svg'
      - '**/*.icns'
